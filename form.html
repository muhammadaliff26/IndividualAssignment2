<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); min-height: 100vh; display: flex; flex-direction: column; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-brand { color: #ffffff; font-size: 1.1rem; font-weight: 600; text-decoration: none; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { color: rgba(255, 255, 255, 0.6); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .nav-links a.active, .nav-links a:hover { color: #e94560; }
        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .form-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 40px; width: 100%; max-width: 550px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); }
        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header .avatar-icon { font-size: 3rem; color: #e94560; margin-bottom: 10px; }
        .form-header h1 { color: #ffffff; font-size: 1.8rem; font-weight: 600; }
        .form-header p { color: rgba(255, 255, 255, 0.5); font-size: 0.85rem; margin-top: 5px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: rgba(255, 255, 255, 0.75); font-size: 0.85rem; margin-bottom: 7px; font-weight: 400; }
        .form-group label i { margin-right: 7px; color: #e94560; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: border-color 0.3s, box-shadow 0.3s; outline: none; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #e94560; box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.2); }
        .form-group select option { background-color: #16213e; color: #ffffff; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; color: rgba(255, 255, 255, 0.75); font-size: 0.85rem; cursor: pointer; margin-bottom: 0; }
        .checkbox-group input[type="checkbox"] { width: auto; accent-color: #e94560; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #e94560, #c62a47); color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233, 69, 96, 0.5); }
        footer { text-align: center; padding: 20px; color: rgba(255, 255, 255, 0.25); font-size: 0.78rem; border-top: 1px solid rgba(255, 255, 255, 0.07); }
        @media (max-width: 480px) { .form-container { padding: 25px 20px; } .form-header h1 { font-size: 1.4rem; } nav { padding: 15px 20px; } }
    </style>
</head>
<body>
    <nav>
        <a class="nav-brand">Profile Management System</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="form.html" class="active">Profile Form</a></li>
            <li><a href="viewProfiles.jsp">View Profiles</a></li>
        </ul>
    </nav>
    <div class="main-content">
        <div class="form-container">
            <div class="form-header">
                <div class="avatar-icon"><i class="fas fa-id-card"></i></div>
                <h1>Personal Profile</h1>
                <p>Fill in your details below</p>
            </div>
            <form action="ProfileServlet" method="post">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Name</label>
                    <input type="text" name="fullName" placeholder="e.g. Ahmad bin Ali" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-id-badge"></i> Student ID</label>
                    <input type="text" name="studentId" placeholder="e.g. 2023123456" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-graduation-cap"></i> Program</label>
                    <select name="program" required>
                        <option value="" disabled selected>Select your program</option>
                        <option value="CS230 BACHELOR OF COMPUTER SCIENCE (HONS.)">CS230 BACHELOR OF COMPUTER SCIENCE (HONS.)</option>
                        <option value="CS240 BACHELOR OF INFORMATION TECHNOLOGY (HONS.)">CS240 BACHELOR OF INFORMATION TECHNOLOGY (HONS.)</option>
                        <option value="CS255 BACHELOR OF COMPUTER SCIENCE (HONS) COMPUTER NETWORKS">CS255 BACHELOR OF COMPUTER SCIENCE (HONS) COMPUTER NETWORKS</option>
                        <option value="CS259 BACHELOR OF INFORMATION SYSTEMS (HONS.) INTELLIGENT SYSTEMS ENGINEERING">CS259 BACHELOR OF INFORMATION SYSTEMS (HONS.) INTELLIGENT SYSTEMS ENGINEERING</option>
                        <option value="CS264 BACHELOR OF INFORMATION SYSTEMS (HONS.) BUSINESS COMPUTING">CS264 BACHELOR OF INFORMATION SYSTEMS (HONS.) BUSINESS COMPUTING</option>
                        <option value="CS266 BACHELOR OF INFORMATION SYSTEMS (HONS.) INFORMATION SYSTEMS ENGINEERING">CS266 BACHELOR OF INFORMATION SYSTEMS (HONS.) INFORMATION SYSTEMS ENGINEERING</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" name="email" placeholder="e.g. ahmad@student.edu.my" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-heart"></i> Hobbies</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="hobbies" value="Reading"> Reading</label>
                        <label><input type="checkbox" name="hobbies" value="Gaming"> Gaming</label>
                        <label><input type="checkbox" name="hobbies" value="Cooking"> Cooking</label>
                        <label><input type="checkbox" name="hobbies" value="Travelling"> Travelling</label>
                        <label><input type="checkbox" name="hobbies" value="Photography"> Photography</label>
                        <label><input type="checkbox" name="hobbies" value="Sports"> Sports</label>
                        <label><input type="checkbox" name="hobbies" value="Music"> Music</label>
                        <label><input type="checkbox" name="hobbies" value="Coding"> Coding</label>
                        <label><input type="checkbox" name="hobbies" value="Drawing"> Drawing</label>
                        <label><input type="checkbox" name="hobbies" value="Painting"> Painting</label>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-comment-dots"></i> Short Self-Introduction</label>
                    <textarea name="introduction" placeholder="Tell us a little about yourself..." required></textarea>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Submit Profile</button>
            </form>
        </div>
    </div>
    <footer>&copy; 2026 Profile Management System &mdash; CSC584 Enterprise Programming</footer>
</body>
</html>
